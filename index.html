<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OpenPencil</title>
    
    <script src="https://unpkg.com/trystero@0.23.0/dist/trystero-mqtt.min.js"></script>

    <script>
      // FIX: Handle restricted environment locks
      window.global = window;
      window.process = { env: {}, browser: true };
      window.__TAURI__ = { invoke: () => Promise.resolve(), convertFileSrc: (s) => s };

      // AUTO-RESET: If the page is blank for 5 seconds after loading,
      // it might be a database lock. This script tries to jumpstart it.
      window.onerror = function() {
        console.log("App crashed. Attempting recovery...");
        localStorage.clear(); // Clears corrupt settings
      };
    </script>

    <style>
      body { margin: 0; background: #1e1e1e; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
      #app:empty ~ #fallback-loader { display: flex; }
      #fallback-loader {
        display: none;
        flex-direction: column;
        align-items: center;
      }
      .dot-loader {
        display: flex;
        gap: 8px;
      }
      .dot {
        width: 12px;
        height: 12px;
        background: #3b82f6;
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out both;
      }
      .dot:nth-child(1) { animation-delay: -0.32s; }
      .dot:nth-child(2) { animation-delay: -0.16s; }
      @keyframes bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1.0); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    
    <div id="fallback-loader">
      <div class="dot-loader">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <p style="margin-top: 20px; font-size: 12px; opacity: 0.5;">WAKING UP ENGINE...</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
