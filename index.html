<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1e1e" />
    <title>OpenPencil</title>
    
    <script src="https://unpkg.com/trystero@0.23.0/dist/trystero-mqtt.min.js"></script>

    <script>
      /** * CHROMEBOOK COMPATIBILITY LAYER 
       * Prevents the app from hanging on restricted devices 
       */
      window.global = window;
      window.process = { env: {} };
      window.__TAURI__ = {
        invoke: () => Promise.resolve(),
        convertFileSrc: (src) => src,
        updater: { checkUpdate: () => Promise.resolve({ shouldUpdate: false }) }
      };

      // EMERGENCY RECOVERY: If the app hasn't loaded in 12 seconds, 
      // force the loader to vanish so we can see the interface.
      setTimeout(() => {
        const loader = document.getElementById('loader');
        if (loader) {
          console.warn("Forcing loader removal after timeout...");
          loader.style.opacity = '0';
          setTimeout(() => { loader.style.display = 'none'; }, 500);
        }
      }, 12000);
    </script>

    <style>
      body { margin: 0; background: #1e1e1e; color: white; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: #1e1e1e;
        transition: opacity 0.5s ease;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255,255,255,0.1);
        border-top: 3px solid #3b82f6; /* Blue indicator */
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loading-text {
        margin-top: 20px;
        font-size: 14px;
        letter-spacing: 0.05em;
        opacity: 0.5;
        animation: pulse 2s infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
    </style>
  </head>

  <body>
    <div id="loader">
      <div class="spinner"></div>
      <div class="loading-text">INITIALIZING ENGINE...</div>
    </div>
    
    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
