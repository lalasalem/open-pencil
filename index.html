<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OpenPencil</title>
    <script src="https://unpkg.com/trystero@0.23.0/dist/trystero-mqtt.min.js"></script>
    <script>
      window.global = window;
      window.process = { env: {}, browser: true };
      window.__TAURI__ = { invoke: () => Promise.resolve(), convertFileSrc: (s) => s };

      // RECOVERY: If the screen is blank, try to force a window resize 
      // event which often "wakes up" canvas rendering engines.
      window.addEventListener('load', () => {
        setTimeout(() => {
          if (document.getElementById('app').innerHTML === "") {
            console.log("Blank screen detected. Forcing engine wake-up...");
            window.dispatchEvent(new Event('resize'));
          }
        }, 5000);
      });
    </script>
    <style>
      body { margin: 0; background: #1e1e1e; height: 100vh; width: 100vw; overflow: hidden; }
      #app { width: 100%; height: 100%; }
      #loading-screen {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #1e1e1e; z-index: 9999;
        transition: opacity 0.5s;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading-screen" id="js-loader">
      <div style="color: #3b82f6;">Loading...</div>
    </div>
    <script>
      // Hide loader when the app actually puts something on the screen
      const observer = new MutationObserver(() => {
        const loader = document.getElementById('loading-screen');
        if (loader) loader.style.display = 'none';
        observer.disconnect();
      });
      observer.observe(document.getElementById('app'), { childList: true });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
