<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OpenPencil</title>
    <script src="https://unpkg.com/trystero@0.23.0/dist/trystero-mqtt.min.js"></script>
    <script>
      window.global = window;
      window.process = { env: {}, browser: true };
      window.__TAURI__ = { invoke: () => Promise.resolve(), convertFileSrc: (s) => s };

      // FORCE START: 
      // If the app doesn't signal it's ready, force hide the loader anyway.
      setTimeout(() => {
        const loader = document.getElementById('loading-screen');
        if (loader) {
          loader.style.display = 'none';
          console.log("Force-starting display...");
        }
      }, 10000); 
    </script>
    <style>
      body { margin: 0; background: #1e1e1e; color: white; height: 100vh; overflow: hidden; }
      #loading-screen {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #1e1e1e; z-index: 9999;
      }
      .spinner {
        width: 30px; height: 30px;
        border: 2px solid rgba(255,255,255,0.1);
        border-top: 2px solid #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading-screen">
      <div class="spinner"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
