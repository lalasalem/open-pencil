<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OpenPencil</title>
    
    <script src="https://unpkg.com/trystero@0.23.0/dist/trystero-mqtt.min.js"></script>

    <script>
      window.global = window;
      window.process = { env: {}, browser: true };
      window.__TAURI__ = { invoke: () => Promise.resolve(), convertFileSrc: (s) => s };

      // CHROMEBOOK RECOVERY
      // If the page stays blank for 6 seconds, try to clear potential locks
      setTimeout(() => {
        if (!document.querySelector('#app').innerHTML) {
          console.warn("Detected blank screen, attempting emergency refresh...");
          localStorage.removeItem('open-pencil-storage'); // Clears potentially heavy cached data
        }
      }, 6000);
    </script>

    <style>
      body { margin: 0; background: #1e1e1e; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
      #app:empty + #loading-screen { display: flex; }
      #loading-screen {
        display: none;
        flex-direction: column;
        align-items: center;
      }
      .spinner {
        width: 30px; height: 30px;
        border: 2px solid rgba(255,255,255,0.1);
        border-top: 2px solid #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    
    <div id="loading-screen">
      <div class="spinner"></div>
      <p style="margin-top: 15px; font-size: 11px; letter-spacing: 1px; opacity: 0.4;">SYNCING ENGINE...</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
